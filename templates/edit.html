<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Workout</title>
    <style>
        :root {
            --bg: #000000;
            --card: #1c1c1e;
            --card-2: #2c2c2e;
            --text: #ffffff;
            --text-dim: #8e8e93;
            --red: #fc3158;
            --cyan: #00e5ff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Helvetica, Arial, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            background: var(--bg);
            color: var(--text);
        }
        h1 { text-align: center; font-weight: 700; }
        form {
            background: var(--card);
            padding: 20px;
            border-radius: 18px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 6px 0 14px 0;
            border: none;
            background: var(--card-2);
            color: var(--text);
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
        }
        label {
            font-size: 13px;
            color: var(--text-dim);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: var(--red);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            margin-top: 6px;
        }
        .cancel {
            display: block;
            text-align: center;
            margin-top: 14px;
            color: var(--cyan);
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>✏️ Edit Workout</h1>
    <form method="POST">
        <label>Exercise</label>
        <input type="text" name="exercise" value="{{ workout[2] }}" required>

        <label>Sets</label>
        <input type="number" name="sets" value="{{ workout[3] }}" required>

        <label>Reps</label>
        <input type="number" name="reps" value="{{ workout[4] }}" required>

        <label>Weight (kg)</label>
        <input type="number" step="0.5" name="weight" value="{{ workout[5] }}" required>

        <button type="submit">Save Changes</button>
    </form>
    <a class="cancel" href="/">Cancel</a>
</body>
</html>
