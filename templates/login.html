<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Fitness Tracker</title>
    <style>
        :root {
            --bg: #000000;
            --card: #1c1c1e;
            --card-2: #2c2c2e;
            --text: #ffffff;
            --text-dim: #8e8e93;
            --red: #fc3158;
            --green: #92e82a;
            --cyan: #00e5ff;
            --separator: #38383a;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Helvetica, Arial, sans-serif;
            max-width: 400px;
            margin: 80px auto;
            padding: 20px;
            background: var(--bg);
            color: var(--text);
        }
        h1 {
            text-align: center;
            color: var(--text);
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        form {
            background: var(--card);
            padding: 24px;
            border-radius: 18px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 6px 0 14px 0;
            border: none;
            background: var(--card-2);
            color: var(--text);
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
        }
        label {
            font-size: 13px;
            color: var(--text-dim);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: var(--red);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
        }
        .error {
            color: var(--red);
            font-size: 14px;
            margin-bottom: 10px;
        }
        .link {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: var(--text-dim);
        }
        a { color: var(--cyan); font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>
    <h1>💪 Log In</h1>
    <form method="POST">
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <label>Email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit">Log In</button>
    </form>
    <div class="link">
        Don't have an account? <a href="/signup">Sign up</a>
    </div>
</body>
</html>
